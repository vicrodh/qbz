# CI for the crates/ workspace on the integration branch.
#
# Three jobs, three economies:
#   test      — `cargo test` on every crate that needs no Qt (scripts/cargo-test.sh:
#               excludes the frozen Slint crates and qbz-qt). ~5 min cold.
#   qt-gate   — the Qt frontend: the five static QML audits, `cargo test -p
#               qbz-qt`, the Slint-free dep-graph gate, and an OFFSCREEN BOOT of
#               the debug binary. This is the thing `cargo check` cannot give:
#               a missing QML component or a call to a bridge member that does
#               not exist compiles clean and throws when the user opens the
#               view. Qt comes from aqt — ubuntu-24.04's own Qt is 6.4.2 and has
#               no QtQuick.Effects module.
#
# Rewritten 2026-08-25 for the Slint -> Qt frontend switch. Release builds stay
# tag/dispatch-only; this is the one workflow that runs on pre-release
# integration so regressions land before a release cut.

name: test-crates

on:
  pull_request:
    # pre-release is the real base; main is listed so a PR opened against main
    # still runs once before redirect-pr-to-prerelease retargets it.
    branches: [pre-release, main]
    paths:
      - "crates/**"
      - "scripts/cargo-test.sh"
      - "scripts/qml-audits/**"
      - ".github/workflows/test-crates.yml"
  push:
    # Integration branch only — never main (a push to main is a release merge).
    branches: [pre-release]
    paths:
      - "crates/**"
      - "scripts/cargo-test.sh"
      - "scripts/qml-audits/**"
      - ".github/workflows/test-crates.yml"
  workflow_dispatch:

concurrency:
  group: test-crates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same pin as build-qt-linux.yml (the Linux floor). Bump both together.
  QT_VERSION: ${{ vars.QT_VERSION_LINUX || '6.8.3' }}

jobs:
  test:
    name: cargo test (workspace, no UI)
    runs-on: ubuntu-24.04
    # The rule: --no-fail-fast, 20 minutes. All cores: measured cold on an
    # equivalent 4-vCPU VM, 392 s (jobs=4) vs 589 s (jobs=2), 2.7 GB peak —
    # the old jobs=2 was a Slint-era memory tier with nothing left to protect.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # Non-UI crates still link ALSA / JACK / D-Bus (qbz-audio) and
          # OpenSSL (reqwest).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libdbus-1-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: test-crates-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/pre-release' }}

      - name: cargo test (scripts/cargo-test.sh — the local mirror)
        env:
          CARGO_TERM_COLOR: always
        run: |
          rustc -V; cargo -V
          START=$(date +%s)
          ./scripts/cargo-test.sh
          echo "cargo test wall time: $(( $(date +%s) - START ))s"

  # Every shader must bake. Separate job so qsb is never on PATH while cargo
  # runs (see qt-gate). The BAKE toolchain is pinned apart from the runtime
  # floor: the committed .qsb need qsb >= 6.9 (plasma/ambient's uint hash
  # constants vs the GLSL 1.20 variant, which desktop GL <= 3.1 selects at
  # runtime, so it must stay in the pack) — see shader_bake_gate.sh.
  shader-gate:
    name: shader bake gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_SHADERTOOLS_VERSION: ${{ vars.QT_VERSION_SHADERTOOLS || '6.9.3' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt ${{ env.QT_SHADERTOOLS_VERSION }} + shader tools
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_SHADERTOOLS_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true
      - name: Bake every shader to a temp dir
        run: scripts/qml-audits/shader_bake_gate.sh "$QT_ROOT_DIR/bin/qsb"

  qt-gate:
    name: qt gate (audits, tests, offscreen boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev nasm dbus \
            libasound2-dev libjack-jackd2-dev libdbus-1-dev libssl-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev

      # No qtshadertools here ON PURPOSE: with qsb on PATH build.rs re-bakes
      # shaders by mtime, which makes a fresh checkout nondeterministic. The
      # build ships the committed .qsb; shader health is the shader-gate job.
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: qmllint (QML type check)
        run: scripts/qml-audits/qmllint_gate.sh "$QT_ROOT_DIR"

      # The audits need Qt's own plugins.qmltypes to resolve QtQuick types —
      # hence after the Qt install, pointed at it. ~1 s, and the class of
      # mistake nothing else in CI can see (a missing component, a bridge
      # member that does not exist).
      - name: QML audits
        env:
          QBZ_QT_QML_DIR: ${{ env.QT_ROOT_DIR }}/qml
        run: |
          set -euo pipefail
          for a in qml_resolution_audit qml_singleton_xref qml_eager_tab_audit qml_module_registration_audit qml_icon_bake_audit; do
            echo "::group::$a"
            python3 "scripts/qml-audits/$a.py" "$PWD/crates/qbz-qt"
            echo "::endgroup::"
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: qt-gate
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/pre-release' }}

      # The exact QT=1 half of scripts/cargo-test.sh, minus its `test` job
      # (already run above) and its shader gate (the shader-gate job, so qsb
      # is never on PATH while cargo runs here): dep-graph gate, cargo test
      # -p qbz-qt, offscreen boot. Kept in the script so local == CI.
      - name: qt gates (scripts/cargo-test.sh QT=1, without the workspace test)
        env:
          CARGO_TERM_COLOR: always
          QBZ_QT_QML_DIR: ${{ env.QT_ROOT_DIR }}/qml
        run: |
          set -euo pipefail
          hits=$(cargo tree --manifest-path crates/Cargo.toml -p qbz-qt -e normal \
                 | grep -E '\b(slint|qbz-ui|qbz-slint-common|qbz-dac-wizard) v' || true)
          [ -z "$hits" ] || { echo "::error::qbz-qt graph resolves Slint crates:"; echo "$hits"; exit 1; }
          cargo test --manifest-path crates/Cargo.toml -p qbz-qt --no-fail-fast
          cargo build --manifest-path crates/Cargo.toml -p qbz-qt
          # Same isolation as scripts/cargo-test.sh: private XDG dirs + a
          # private session bus (the single-instance lock is a D-Bus name).
          iso="$(mktemp -d)"
          XDG_CONFIG_HOME="$iso/config" XDG_DATA_HOME="$iso/data" XDG_CACHE_HOME="$iso/cache" XDG_STATE_HOME="$iso/state" \
            QT_QPA_PLATFORM=offscreen RUST_LOG=info dbus-run-session -- timeout 75 ./crates/target/debug/qbz > smoke.log 2>&1 || true
          lines=$(wc -l < smoke.log); echo "smoke log: $lines lines"
          if (( lines < 10 )); then cat smoke.log; echo "::error::the app did not start"; exit 1; fi
          pat='is not a type|unavailable|ReferenceError|TypeError|Cannot read|Unable to assign|Cannot open|no such method|non-existent property|failed to load component|is not installed'
          errs=$(grep -av 'propertyCache' smoke.log | grep -aciE "$pat" || true)
          if (( errs > 0 )); then grep -av 'propertyCache' smoke.log | grep -aiE "$pat" | head -20; echo "::error::$errs QML complaint(s)"; exit 1; fi
          grep -aq 'QbzCore initialized' smoke.log || { tail -20 smoke.log; echo "::error::never reached QbzCore init"; exit 1; }
          echo "smoke OK (0 QML complaints, core initialized)"
